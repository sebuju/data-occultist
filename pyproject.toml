[project]
name = "data-occultist"
version = "0.1.0"
description = "data-occultist: collect structured data from games via screen capture + OCR"
requires-python = ">=3.11"
dependencies = [
    "mss>=9.0",
    "pywin32>=306; sys_platform == 'win32'",
    "psutil>=5.9",
    "rapidocr-onnxruntime>=1.3",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.6",
]

[project.scripts]
data-occultist = "oc.cli:main"
occ = "oc.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
# Native desktop window for the teaching UI (data-occultist view / app / the install.ps1 shortcut).
# pywebview renders via the Edge WebView2 runtime on Windows (preinstalled on Win11).
# The shortcut runs `pythonw -m oc.desktop_main` from this venv, so the GPU OCR stack
# the installer put here is used directly — no giant standalone bundle.
desktop = ["pywebview>=5.0"]
# Windows.Graphics.Capture backend (capture: wgc in settings.yaml). Reads DWM's
# already-composited frame, so it never forces the game to re-render the way
# PrintWindow does -> no per-grab stutter. Rust-backed WGC wheel; Win10 1803+.
wgc = ["windows-capture>=1.5,<2"]
# GPU OCR (Windows + NVIDIA CUDA 12 / cuDNN 9). Install with:
#   pip uninstall -y onnxruntime && pip install -e ".[gpu]"
# onnxruntime-gpu replaces onnxruntime; the nvidia-*-cu12 wheels ship the CUDA DLLs
# (the OCR engine adds them to PATH at runtime). Then pick "GPU" in the top bar.
gpu = [
    "onnxruntime-gpu>=1.20",
    "nvidia-cudnn-cu12", "nvidia-cublas-cu12", "nvidia-cuda-runtime-cu12",
    "nvidia-cufft-cu12", "nvidia-curand-cu12", "nvidia-cusparse-cu12", "nvidia-cuda-nvrtc-cu12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: hits the live warframe.market API; skipped (never failed) when it's unreachable",
]
