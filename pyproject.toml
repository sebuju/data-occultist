[project]
name = "oc"
version = "0.1.0"
description = "On-screen reader: collect structured data from games via screen capture + OCR"
requires-python = ">=3.11"
dependencies = [
    "mss>=9.0",
    "pywin32>=306; sys_platform == 'win32'",
    "psutil>=5.9",
    "rapidocr-onnxruntime>=1.3",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.6",
]

[project.scripts]
oc = "oc.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
