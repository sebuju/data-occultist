# Which backend implementation to use for each pluggable subsystem.
# Change a name here (and ensure a module registers it) to swap a backend.
# A bare string is shorthand for {name: <str>, options: {}}.

capture: wgc          # oc.capture.*    -> grabs pixels. wgc = DWM-composited (no per-grab
                      #   game re-render hitch; works backgrounded/occluded; capped at
                      #   monitor refresh). printwindow = window-targeted but forces a
                      #   fresh render each grab. mss = screen-region (window must be on top).
window: win32       # oc.window.*       -> locates the game window (Windows)
process: psutil     # oc.process.*      -> finds the running game
ocr:                # oc.ocr.*          -> reads text from regions
  # Device (cpu/gpu/auto) is picked in the web UI and persisted to data/.ocr_device;
  # it defaults to GPU whenever CUDA is present (CPU is the no-CUDA fallback).
  # ppocr5 = new-gen rapidocr package (PP-OCRv5/v6 models; needs the [ppocr5] extra).
  # Rollback = the old tuned backend:
  #   name: rapidocr
  #   options: {rec_chunk: 8, yield_ms: 3,   # GPU pacing knobs (ppocr5 has none)
  #             intra_op_num_threads: 2, inter_op_num_threads: 1}   # same CPU-cap intent
  name: ppocr5
  options:
    engine_type: onnxruntime   # or openvino ([ppocr5-openvino] extra) — often faster on CPU
    rec_batch_num: 16          # grid reads recognise dozens of crops; fewer, bigger launches
    # Cap ORT's CPU pool: the default is one worker per core, spin-waiting between
    # inferences — CPU stolen from the game. 2 threads keeps reads quick while staying
    # polite; the same option caps openvino's pool when that engine is selected.
    intra_op_num_threads: 2
    inter_op_num_threads: 1
classifier: detect  # oc.detect.*       -> decides window + state
corrector: rapidfuzz  # oc.learn.*      -> fuzzy-corrects uncertain OCR

tuning:
  accept_confidence: 0.88   # >= this: trust + learn the term
  min_confidence: 0.50      # worst-field floor; below -> drop record
  confirm_frames: 2         # stable frames required before saving (anti-popup)
  collect_interval: 1.0     # OCR throttle: OCR-heavy path runs at most once per this many
                            #   seconds; lower for faster-changing views, 0 = no throttle
  gate_interval: 0.25       # fast poll of the cheap worthiness gate (no OCR); idle ticks
                            #   stay cheap while an OCR-worthy phase is caught promptly
  live_gate: true           # honour the game-level detect gate (skip OCR while no worthy
                            #   phase is up); no-op when a profile declares no gate
  require_foreground: false  # true only if using screen-region capture

profiles_dir: config/games
data_dir: data
