producers:
- id: wf_market_live
  type: http
  mode: orders
  dataset: prices_live
  throttle: 0.4
  enabled: true
  sources:
  - master
  source_field: name
  http:
    request:
      method: GET
      url: https://api.warframe.market/v2/orders/item/{key}
      headers:
        platform: pc
        User-Agent: oc/0.1
        Accept: application/json
      query: {}
      timeout: 30.0
    key_transform: catalogue
    key_encode: true
    catalogue:
      url: https://api.warframe.market/v2/items
      items_path: data
      name_path: i18n.en.name
      key_path: slug
      fuzzy: 0.9
      ttl_days: 7.0
      suffix_hints:
      - _set
    root: data
    explode: []
    fields:
    - out_field: price_min
      path: ''
      template: ''
      array:
        filter:
        - path: type
          op: eq
          value: sell
        - path: user.status
          op: in
          value:
          - online
          - ingame
        pluck: platinum
        agg: min
        depth: 5
      type: number
      required: false
    - out_field: price_median
      path: ''
      template: ''
      array:
        filter:
        - path: type
          op: eq
          value: sell
        - path: user.status
          op: in
          value:
          - online
          - ingame
        pluck: platinum
        agg: median_low
        depth: 5
      type: number
      required: false
    - out_field: volume
      path: ''
      template: ''
      array:
        filter:
        - path: type
          op: eq
          value: sell
        - path: user.status
          op: in
          value:
          - online
          - ingame
        pluck: platinum
        agg: count
        depth: 5
      type: number
      required: false
- id: producer
  type: http
  mode: ''
  dataset: relic_contents
  throttle: 0.4
  enabled: true
  sources: []
  source_field: name
  http:
    request:
      method: GET
      url: https://raw.githubusercontent.com/WFCD/warframe-drop-data/main/data/relics.json
      headers:
        User-Agent: oc/0.1
        Accept: application/json
      query: {}
      timeout: 60.0
    key_transform: none
    key_encode: false
    root: ''
    explode:
    - relics
    - rewards
    fields:
    - out_field: name
      path: ''
      template: '{tier} {relicName}'
      type: text
      required: true
    - out_field: item
      path: itemName
      template: ''
      type: text
      required: true
    - out_field: rarity
      path: rarity
      template: ''
      type: text
      required: false
  key:
    fields:
    - name
    - item
    sep: '|'
    case_sensitive: false
