<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>oc — data flow</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="navlink" href="/">← games</a>
    <strong>data flow</strong>
    <label>game <select id="gameSelect"></select></label>
    <label class="inline"><input type="checkbox" id="autoRefresh" checked /> live</label>
    <button id="refreshBtn">Refresh</button>
    <span class="spacer"></span>
    <span id="status" class="status"></span>
  </header>

  <main class="dash">
    <div id="diagram" class="diagram">
      <svg id="edges" class="edges"></svg>
      <div class="col" id="winCol"></div>
      <div class="col" id="capCol"></div>
      <div class="col" id="dsCol"></div>
    </div>

    <section class="detail">
      <h3 id="detailTitle">Dataset</h3>
      <div class="detail-cols">
        <div>
          <h4>Recent changes</h4>
          <ul id="history" class="history"></ul>
        </div>
        <div>
          <h4>Current records (<span id="recCount">0</span>)</h4>
          <div id="records" class="records"></div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/js/dash.js"></script>
</body>
</html>
