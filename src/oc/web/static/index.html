<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>data-occultist — node view</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- style.css was split by section; load order is the cascade order (see each file's banner) -->
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/chrome.css" />
    <link rel="stylesheet" href="/css/graph.css" />
    <link rel="stylesheet" href="/css/overlays.css" />
    <link rel="stylesheet" href="/css/controls.css" />
    <link rel="stylesheet" href="/css/flow.css" />
    <link rel="stylesheet" href="/css/tables.css" />
    <link rel="stylesheet" href="/css/pretty.css" />
    <link rel="stylesheet" href="/floatwin.css" />
</head>
<body spellcheck="false">
    <!-- Cauldron mark, defined ONCE as an SVG sprite so every instance (boot veil, pretty
         view-mode corner) is a <use>, never a copied path set. Visual cl-* classes live in
         controls.css and style the cloned content wherever it's referenced. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="cauldron-mark" viewBox="0 0 100 100" overflow="visible">
            <path class="cl-pot" d="M22 48 H78 L71 80 A5 5 0 0 1 66 85 H34 A5 5 0 0 1 29 80 Z" />
            <ellipse class="cl-rim" cx="50" cy="48" rx="28" ry="7" />
            <path class="cl-legs" d="M34 85 L30 95 M66 85 L70 95" />
            <g class="cl-bubbles">
                <circle class="cl-bubble" cx="40" cy="46" r="4"   style="--d:0s" />
                <circle class="cl-bubble" cx="52" cy="46" r="6"   style="--d:.5s" />
                <circle class="cl-bubble" cx="60" cy="46" r="4.5" style="--d:1s" />
                <circle class="cl-bubble" cx="45" cy="46" r="3.5" style="--d:1.5s" />
                <circle class="cl-bubble" cx="56" cy="46" r="3.5" style="--d:.8s" />
                <circle class="cl-bubble" cx="48" cy="46" r="3"   style="--d:1.9s" />
            </g>
        </symbol>
    </svg>
    <!-- Full-page veil shown from FIRST PAINT: the boot sequence (stop stray OCR,
       load profile, reopen images, first detect/preview round) makes the page laggy
       and half-interactive — block everything until it has settled. Removed by
       graph/main.js once boot quiesces (hard-capped, so a hung server can't keep
       the veil up forever). -->
    <!-- pretty view-mode edge hover triggers: thin fixed strips that reveal the hidden topbar /
       logbar when the cursor reaches the top / bottom edge. Inert unless body.pretty-view (CSS). -->
    <div class="pw-edge-trigger top"></div>
    <div class="pw-edge-trigger bottom"></div>
    <!-- decorative cauldron mark + label, bottom-right of pretty view mode only (CSS-gated on body.pretty-view) -->
    <div class="pw-cauldron-mark" aria-hidden="true">
        <svg viewBox="0 0 100 100"><use href="#cauldron-mark" /></svg>
        <div class="pw-cauldron-label">data occultist</div>
    </div>
    <div id="bootveil">
        <div class="bootveil-box">
            <svg class="cauldron-loader" viewBox="0 0 100 100" aria-hidden="true"><use href="#cauldron-mark" /></svg>
            <div class="bootveil-title">data occultist</div>
        </div>
    </div>
    <header class="topbar">
        <button id="settingsBtn" class="cogbtn" title="settings: new game, OCR device + downscale">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <label><select id="gameSelect"></select></label>
        <!-- node ⇄ pretty view switch (both views are the same SPA; pretty is a convenience layer) -->
        <div class="pw-viewtoggle">
            <button class="vt active" id="vtNode" title="node view: the graph editor">node</button>
            <button class="vt" id="vtPretty" title="pretty view: the built dashboard surface">pretty</button>
        </div>
        <button id="killGpuBtn" class="killbtn" title="kill GPU OCR: drop the model and free VRAM (stays on GPU; rebuilds on next read)" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
            kill gpu
        </button>
        <span id="gpuMemLbl" class="gpumem" title="dedicated VRAM held by the OCR process right now" hidden></span>
        <!-- pretty-dirty controls: shown in node view only when transient overrides exist -->
        <div class="pw-dirtybar" id="prettyDirtyBar" hidden>
            <span class="pw-dirty-count" id="prettyDirtyCount"></span>
            <button id="prettyRevertBtn" class="modebtn" title="revert pretty overrides to the authored yaml (click again to confirm)">revert pretty</button>
            <button id="prettySaveBtn" class="modebtn" title="save pretty overrides into the yaml (click again to confirm)">save pretty</button>
        </div>
        <!-- narrow-window (<600px) toggle: collapses .topbar-tools into a dropdown. Hidden by CSS
             above the breakpoint; wired in panels_init.js. -->
        <button id="toolsMenuBtn" class="modebtn tools-menu-btn" title="tools" aria-label="tools">☰</button>
        <!-- floating-window toggles. testing + stats sit leftmost (separated from the rest by a
         rule); a spacer pushes the rest right. -->
        <div class="topbar-tools">
            <button id="inspectorBtn" class="modebtn" title="inspector: select a node to feed it test values, dataset rows, or fire cues (no game needed)">inspector</button>
            <button id="statsBtn" class="modebtn" title="stats: per-node execution durations — spot what's getting slow">stats</button>
            <button id="dbstructBtn" class="modebtn" title="database: SQLite store structure — tables, indexes, per-dataset row counts">db</button>
            <button id="historyBtn" class="modebtn" title="history: every edit — click one to travel there (undo/redo, non-destructive)">history</button>
            <span class="spacer"></span>
            <button id="liveBtn" class="modebtn" title="live panel: toggle live view + per-window detection (no saving)">live</button>
            <button id="precapBtn" class="modebtn" title="precapture: record frames fast, OCR them in a batch, then save">precapture</button>
            <button id="createBtn" class="modebtn" title="toolbox: window collision check and other tools (right-click the canvas to add nodes)">toolbox</button>
            <button id="themeBtn" class="modebtn" title="theme: recolour the node view (css vars) + manage group colour schemes">theme</button>
            <button id="nodemapBtn" class="modebtn" title="node map: overview + jump to any node">map</button>
            <button id="nodelistBtn" class="modebtn" title="node list: edge-tree outline + jump to any node">nodes</button>
            <button id="activityBtn" class="modebtn" title="tasks: live price sweeps + precapture progress">tasks</button>
        </div>
        <!-- pretty view tools replace .topbar-tools in pretty mode; filled by pretty/topbar.js -->
        <div class="topbar-pretty-tools" id="prettyTools"></div>
    </header>

    <!-- Selection toolbar: fixed under the topbar, shown whenever a node is selected
       (single focus, marquee, or shift-click). Acts on the live selection. -->
    <div id="seltoolbar" class="seltoolbar" hidden>
        <span id="selCount" class="sel-count">0 selected</span>
        <button id="selGroupBtn" title="group the selection"><span class="sel-ic">⬚</span><span class="sel-lbl">group</span></button>
        <button id="selSubgroupBtn" title="sub-group the selection within its group" hidden><span class="sel-ic">⬓</span><span class="sel-lbl">subgroup</span></button>
        <button id="selSuperBtn" title="super-group the selected groups" hidden><span class="sel-ic">▦</span><span class="sel-lbl">super-group</span></button>
        <button id="selDetachBtn" title="remove the selection from its group" hidden><span class="sel-ic"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M5 7V4.5a3 3 0 0 1 5.9-.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><rect x="3.2" y="7" width="9.6" height="6.5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span><span class="sel-lbl">remove from group</span></button>
        <span class="sel-sep"></span>
        <button id="selCloneBtn" class="sel-icon-only" title="clone the selection (fresh non-colliding id)" hidden><span class="sel-ic"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></span></button>
        <button id="selDeleteBtn" class="sel-del" title="delete the selection" hidden><span class="sel-ic"><svg class="ic-trash" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M16 9v10H8V9h8m-1.5-6h-5l-1 1H5v2h14V4h-3.5l-1-1zM18 7H6v12c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7z"/></svg></span><span class="sel-lbl"></span></button>
        <span class="sel-sep"></span>
        <button id="selCopySizeBtn" class="sel-icon-only" title="copy this node's size" hidden><span class="sel-ic"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><rect x="3" y="3" width="12" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9 9h12v12H9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.4 2"/></svg></span></button>
        <button id="selPasteSizeBtn" class="sel-icon-only" title="paste the copied size to the selection" hidden><span class="sel-ic"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M4 5h16v16H4z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2h8v3H8z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9 12h7v6H9z" fill="currentColor" opacity=".55"/></svg></span></button>
        <button id="selResetSizeBtn" class="sel-icon-only" title="reset the selection's size to fit its content (shift+R)" hidden><span class="sel-ic"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.6 2.2"/><path d="M9 9h6v6H9z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 6.6V9M12 15v2.4M6.6 12H9M15 12h2.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span></button>
        <span class="sel-sep"></span>
        <button id="selClearBtn" class="sel-icon-only" title="clear selection" aria-label="clear selection">✕</button>
    </div>

    <main class="graphwrap">
        <div id="graph" class="graphcanvas">
            <!-- #gpan carries the PAN (translate); #gworld carries the ZOOM (scale). Split so a
                 pure pan never touches #gworld's style (its observers stay quiet). Both paint
                 normally — composited/will-change variants all broke rendering (graph.css). -->
            <div id="gpan">
            <div id="gworld">
                <div id="sgroups"></div>
                <div id="ggroups"></div>
                <div id="subgroups"></div>
                <div id="gnodes"></div>
            </div>
            </div>
            <div id="marquee" class="marquee" hidden></div>
        </div>
        <!-- Pretty Studio surface: same SPA, shown instead of #graph in pretty view. Mounted lazily. -->
        <div id="pretty"></div>
    </main>

    <div id="logbar" class="logbar">
        <div class="log-head">
            <span class="log-prompt">&gt;_</span>
            <span class="log-latest">ready</span>
            <span class="log-workers" id="logWorkers" hidden></span>
            <span class="log-toggle">▴</span>
        </div>
        <div class="log-body"></div>
    </div>

    <script type="module" src="/js/graph/main.js"></script>
</body>
</html>
