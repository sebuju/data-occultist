<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>oc — node view</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body spellcheck="false">
  <!-- Full-page veil shown from FIRST PAINT: the boot sequence (stop stray OCR,
       load profile, reopen images, first detect/preview round) makes the page laggy
       and half-interactive — block everything until it has settled. Removed by
       graph/main.js once boot quiesces (hard-capped, so a hung server can't keep
       the veil up forever). -->
  <div id="bootveil">
    <div class="bootveil-box">
      <div class="bootveil-spin"></div>
      <p id="bootveilMsg">loading…</p>
    </div>
  </div>
  <header class="topbar">
    <strong>oc</strong>
    <label>game <select id="gameSelect"></select></label>
    <input id="newGameName" placeholder="new game" style="width:12ch" />
    <button id="newGameBtn">New</button>
    <label class="inline" title="OCR device — GPU needs onnxruntime-gpu + CUDA">
      <select id="ocrDevice"><option value="cpu">CPU</option><option value="gpu">GPU</option></select>
    </label>
    <label class="inline" title="downscale big frames before OCR — faster + far less GPU memory">
      <select id="ocrScale">
        <option value="1">1× full</option>
        <option value="2">½ (¼ pixels)</option>
        <option value="4">¼ (1/16 pixels)</option>
      </select>
    </label>
    <span class="spacer"></span>
    <span id="livestats" class="livestats" hidden></span>
    <button id="liveBtn" class="modebtn" title="live view: re-read open windows continuously (no saving)">live</button>
    <button id="precapBtn" class="modebtn" title="precapture: record frames fast, OCR them in a batch, then save">precapture</button>
    <button id="nodemapBtn" class="modebtn" title="node map: overview + jump to any node">map</button>
    <button id="backupsBtn" class="modebtn" title="backups: browse and restore saved versions of this profile">backups</button>
  </header>

  <!-- Selection toolbar: fixed under the topbar, shown only while >1 node is
       multi-selected (marquee or shift-click). Acts on the live selection. -->
  <div id="seltoolbar" class="seltoolbar" hidden>
    <span id="selCount" class="sel-count">0 selected</span>
    <button id="selGroupBtn" title="group / ungroup the selection (hotkey: g)">⬚ group</button>
    <button id="selClearBtn" title="clear selection">clear</button>
  </div>

  <main class="graphwrap">
    <div id="graph" class="graphcanvas">
      <div id="gworld">
        <div id="ggroups"></div>
        <svg id="gedges">
          <defs>
            <marker id="flowarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" class="flowarrow-head" />
            </marker>
          </defs>
        </svg>
        <div id="gnodes"></div>
        <svg id="gedges-top"></svg>
      </div>
      <div id="marquee" class="marquee" hidden></div>
    </div>
  </main>

  <div id="logbar" class="logbar">
    <div class="log-head">
      <span class="log-prompt">&gt;_</span>
      <span class="log-latest">ready</span>
      <span class="log-workers" id="logWorkers" hidden></span>
      <span class="log-toggle">▴</span>
    </div>
    <div class="log-body"></div>
  </div>

  <script type="module" src="/js/graph/main.js"></script>
</body>
</html>
