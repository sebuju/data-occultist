<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>data-rig — node view</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- style.css was split by section; load order is the cascade order (see each file's banner) -->
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/chrome.css" />
  <link rel="stylesheet" href="/css/graph.css" />
  <link rel="stylesheet" href="/css/overlays.css" />
  <link rel="stylesheet" href="/css/controls.css" />
  <link rel="stylesheet" href="/css/flow.css" />
  <link rel="stylesheet" href="/css/tables.css" />
  <link rel="stylesheet" href="/floatwin.css" />
</head>
<body spellcheck="false">
  <!-- Full-page veil shown from FIRST PAINT: the boot sequence (stop stray OCR,
       load profile, reopen images, first detect/preview round) makes the page laggy
       and half-interactive — block everything until it has settled. Removed by
       graph/main.js once boot quiesces (hard-capped, so a hung server can't keep
       the veil up forever). -->
  <div id="bootveil">
    <div class="bootveil-box">
      <div class="loader-orbit"><div class="arm"><div class="dot"></div></div></div>
    </div>
  </div>
  <header class="topbar">
    <button id="settingsBtn" class="cogbtn" title="settings: new game, OCR device + downscale">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <label><select id="gameSelect"></select></label>
    <button id="killGpuBtn" class="killbtn" title="kill GPU OCR: drop the model and free VRAM (stays on GPU; rebuilds on next read)" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
      kill gpu
    </button>
    <!-- floating-window toggles. testing sits leftmost; a spacer pushes the rest right. -->
    <div class="topbar-tools">
      <button id="testingBtn" class="modebtn" title="testing: feed a recorded video through live OCR (no game needed)">testing</button>
      <span class="spacer"></span>
      <button id="liveBtn" class="modebtn" title="live panel: toggle live view + per-window detection (no saving)">live</button>
      <button id="precapBtn" class="modebtn" title="precapture: record frames fast, OCR them in a batch, then save">precapture</button>
      <button id="createBtn" class="modebtn" title="create: add window / price / trigger / dictionary nodes">create</button>
      <button id="nodemapBtn" class="modebtn" title="node map: overview + jump to any node">map</button>
      <button id="activityBtn" class="modebtn" title="tasks: live price sweeps + precapture progress">tasks</button>
    </div>
  </header>

  <!-- Selection toolbar: fixed under the topbar, shown only while >1 node is
       multi-selected (marquee or shift-click). Acts on the live selection. -->
  <div id="seltoolbar" class="seltoolbar" hidden>
    <span id="selCount" class="sel-count">0 selected</span>
    <button id="selGroupBtn" title="group / ungroup the selection (hotkey: g)">⬚ group</button>
    <button id="selClearBtn" title="clear selection">clear</button>
  </div>

  <main class="graphwrap">
    <div id="graph" class="graphcanvas">
      <div id="gworld">
        <div id="sgroups"></div>
        <div id="ggroups"></div>
        <svg id="gedges">
          <defs>
            <marker id="flowarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" class="flowarrow-head" />
            </marker>
            <!-- trigger control line end: a perpendicular bar (not an arrowhead) so a fire-control
                 edge reads differently from data flow. Takes the line's colour via context-stroke. -->
            <marker id="triggerbar" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
              <path d="M2,0 L2,10" class="triggerbar-head" />
            </marker>
            <!-- watch (on_change) line end: a small diamond, distinct from the data arrow and the
                 trigger bar so a "fires-on-new-rows" edge reads on sight. Takes the line's colour. -->
            <marker id="watchcap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
              <path d="M0,5 L5,0 L10,5 L5,10 z" class="watchcap-head" />
            </marker>
          </defs>
        </svg>
        <div id="gnodes"></div>
        <svg id="gedges-top"></svg>
      </div>
      <div id="marquee" class="marquee" hidden></div>
    </div>
  </main>

  <div id="logbar" class="logbar">
    <div class="log-head">
      <span class="log-prompt">&gt;_</span>
      <span class="log-latest">ready</span>
      <span class="log-workers" id="logWorkers" hidden></span>
      <span class="log-toggle">▴</span>
    </div>
    <div class="log-body"></div>
  </div>

  <script type="module" src="/js/graph/main.js"></script>
</body>
</html>
